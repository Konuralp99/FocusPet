name: Build and Release Focus Pet

on:
  push:
    tags:
      - 'v*' # v1.0, v1.1 gibi tag atıldığında çalışır

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        # --noconsole: GUI uygulaması olduğu için konsolu gizle
        # --onefile: Tek bir exe dosyası yap
        # --add-data: Assets klasörünü içeri göm
        pyinstaller --noconsole --onefile --add-data "assets;assets" --name "FocusPet" main.py

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: dist/FocusPet.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
